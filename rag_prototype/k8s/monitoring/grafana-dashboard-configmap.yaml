apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rag-api-dashboard.json: |
    {
      "title": "RAG API Overview",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "expr": "sum(rate(rag_requests_total[5m]))",
              "legendFormat": "req/s"
            }
          ],
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}
        },
        {
          "type": "timeseries",
          "title": "Request latency (p95)",
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(rag_request_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}
        }
      ]
    }
