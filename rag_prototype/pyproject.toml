[project]
name = "rag-prototype"
version = "0.1.0"
description = "RAG prototype recipe"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "mlflow>=3.6.0",
    "metaflow>=2.12.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "ragas>=0.1.15",
    "datasets>=2.20.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.34.0",
]

[tool.uv]
package = true
