dataset:
  # Local 10-K filings directory (run `uv run data_pipeline/fetch_10k.py` first)
  source_dir: data_pipeline/10k_filings
  doc_limit: 10  # Max documents to process

chunking:
  chunk_size: 800
  chunk_overlap: 100

chroma:
  host: chroma.chroma.svc.cluster.local
  port: 8000
  collection: finder
  rebuild: true

embeddings:
  model: BAAI/bge-large-en-v1.5

s3:
  bucket: your-bucket-name
  prefix: rag-stack/chroma-snapshots
  keep_last: 3
