dataset:
  # Local 10-K filings directory (auto-fetched when fetch_on_start is true)
  source_dir: data_pipeline/10k_filings
  doc_limit: 500  # Max documents to process
  fetch_on_start: true
  fetch_count: 500  # Number of companies to fetch per run

chunking:
  chunk_size: 800
  chunk_overlap: 100

chroma:
  host: localhost
  port: 8000
  collection: finder
  rebuild: true

embeddings:
  model: BAAI/bge-large-en-v1.5
