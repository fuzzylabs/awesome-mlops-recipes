apiVersion: v1
kind: ConfigMap
metadata:
  name: metaflow-config
  namespace: metaflow
data:
  METAFLOW_DEFAULT_METADATA: service
  METAFLOW_SERVICE_URL: http://metaflow.metaflow.svc.cluster.local:8080
  METAFLOW_DEFAULT_DATASTORE: s3
  METAFLOW_DATASTORE_SYSROOT_S3: s3://your-bucket/metaflow
  METAFLOW_DATATOOLS_SYSROOT_S3: s3://your-bucket/metaflow
  MF_METADATA_DB_HOST: your-rds-endpoint
  MF_METADATA_DB_PORT: "5432"
  MF_METADATA_DB_USER: mlflow
  MF_METADATA_DB_NAME: metaflow
  MF_METADATA_DB_TYPE: postgres
