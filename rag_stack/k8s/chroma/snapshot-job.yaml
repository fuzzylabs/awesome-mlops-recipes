apiVersion: batch/v1
kind: Job
metadata:
  name: chroma-snapshot
  namespace: chroma
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: chroma-snapshot
      restartPolicy: Never
      containers:
        - name: snapshot
          image: amazon/aws-cli:2.15.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SNAPSHOT_NAME=$(date -u +%Y%m%d-%H%M%S)
              ARCHIVE=/tmp/chroma-${SNAPSHOT_NAME}.tar.gz
              tar -czf "$ARCHIVE" -C /chroma chroma
              aws s3 cp "$ARCHIVE" s3://$S3_BUCKET/$S3_PREFIX/${SNAPSHOT_NAME}.tar.gz

              KEYS=$(aws s3 ls s3://$S3_BUCKET/$S3_PREFIX/ | awk '{print $4}')
              COUNT=$(echo "$KEYS" | wc -l | tr -d ' ')
              if [ "$COUNT" -gt "$KEEP_LAST" ]; then
                DELETE_COUNT=$((COUNT - KEEP_LAST))
                echo "$KEYS" | head -n $DELETE_COUNT | while read -r KEY; do
                  if [ -n "$KEY" ]; then
                    aws s3 rm s3://$S3_BUCKET/$S3_PREFIX/$KEY
                  fi
                done
              fi
          env:
            - name: S3_BUCKET
              value: your-bucket
            - name: S3_PREFIX
              value: rag-stack/chroma-snapshots
            - name: KEEP_LAST
              value: "3"
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data
