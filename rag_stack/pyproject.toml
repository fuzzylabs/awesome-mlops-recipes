[project]
name = "rag-stack"
version = "0.1.0"
description = "RAG stack recipe"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = true

[dependency-groups]
# Production RAG API dependencies
prod = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "mlflow>=3.6.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "guardrails-ai>=0.7.2",
    "prometheus-client>=0.20.0",
]

# Data pipeline dependencies
pipeline = [
    "metaflow>=2.12.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.34.0",
]

# Evaluation dependencies
eval = [
    "ragas>=0.1.15",
    "datasets>=2.20.0",
]

# Feedback loop dependencies
feedback = [
    "pydantic-ai[openai]>=1.22.0",
    "psycopg[binary]>=3.2.0",
]
