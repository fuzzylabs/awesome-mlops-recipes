apiVersion: v1
kind: Service
metadata:
  name: logfire-backend
  namespace: logfire
  labels:
    app: logfire-backend
spec:
  type: ClusterIP
  selector:
    app: logfire-backend
  ports:
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: ui
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
