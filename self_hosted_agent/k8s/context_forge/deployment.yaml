apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-forge
  namespace: context-forge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context-forge
  template:
    metadata:
      labels:
        app: context-forge
    spec:
      containers:
        - name: context-forge
          image: ghcr.io/ibm/mcp-context-forge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4444
          envFrom:
            - configMapRef:
                name: context-forge-env
            - secretRef:
                name: context-forge-db
          volumeMounts:
            - name: context-forge-plugins
              mountPath: /app/plugins/config.yaml
              subPath: config.yaml
      volumes:
        - name: context-forge-plugins
          configMap:
            name: context-forge-plugins
