apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3
  namespace: vllm
  labels:
    app: qwen3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3
  template:
    metadata:
      labels:
        app: qwen3
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu.present: "true"
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: qwen3
          
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
      containers:
        - name: qwen3
          image: 196980041487.dkr.ecr.eu-west-2.amazonaws.com/vllm-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              cpu: "3"
              memory: 12Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "1"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache-volume
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30