# PR Review Agent Configuration
# You can override this file with a ConfigMap in Kubernetes

# Model Configuration
model:
  # Choose: 'vllm', or 'ollama'
  provider: "ollama"
  
  # Ollama settings
  ollama:
    model_name: "Qwen/Qwen3-4B-Thinking-2507"
    base_url: "http://localhost:8000/v1"
  
  # vLLM settings (self-hosted in Kubernetes)
  vllm:
    model_name: "Qwen/Qwen3-4B-Thinking-2507"
    base_url: "http://localhost:8000/v1"

# MLflow Configuration
mlflow:
  tracking_uri: "http://localhost:5000"
  prompt_name: "pr-review-agent-system-prompt"
  # Leave empty for latest version
  prompt_version: ""

# MCP Configuration
mcp:
  # Optional gateway URL (ContextForge). Leave empty to use GitHub MCP directly.
  gateway_url: ""
  # Optional gateway auth token (Bearer) for ContextForge.
  gateway_auth_token: ""
  # Forward GitHub token as X-Upstream-Authorization when using the gateway.
  gateway_forward_github_token: true
  # Direct GitHub MCP URL for Part 1 prototype.
  github_mcp_url: "https://api.githubcopilot.com/mcp/"
